
name: Build Nocturne Stonebound

on:
  workflow_dispatch:
  push:
    paths:
      - '**.java'
      - '**.json'
      - '**.png'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-from-archive.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Stonebound-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
